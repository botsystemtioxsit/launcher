name: Background transparency experiments

# Проверка плагинов на настоящей Windows-машине GitHub (не на компьютере владельца: сборка Windows и набор программ другие,
# но панель задач, Проводник и окна — настоящие). Запускается вручную; результат — папка results в ветке ci-e2e-bg:
# отчёт report.txt, журналы движка, дерево элементов панели и снимки экрана до / во время / после.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run experiments
        shell: pwsh
        run: ./tests/e2e/bg-experiment.ps1 -Out results-bg
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: results-bg/*

      - name: Results to branch ci-e2e-bg
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'e2e-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item results-bg/* $dir -Recurse -ErrorAction SilentlyContinue
          Set-Location $dir
          git init -q
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout -q -b ci-e2e-bg
          git add .
          git commit -q -m 'Результаты проверки плагинов на Windows'
          git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          git push -q --force origin ci-e2e-bg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
