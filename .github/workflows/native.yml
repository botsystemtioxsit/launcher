name: Native apps (C++)

# Нативные (C++) приложения: собираются на Windows-раннере MinGW-w64 (один статический exe без .NET), логика и рисование проверяются там же,
# на настоящей Windows. Результат — ветка ci-e2e-native и артефакт native-windows.
on:
  workflow_dispatch:
  push:
    branches: [main, 'ccr-**']
    paths: ['Native/**', 'Shared/Loc/common.loc', '.github/workflows/native.yml', 'tests/e2e/native-*.ps1']

permissions:
  contents: write

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        shell: pwsh
        run: |
          $env:PATH = 'C:\mingw64\bin;' + $env:PATH
          g++ --version | Select-Object -First 1
          cmake --version | Select-Object -First 1
          ninja --version

      # Движок панели задач (DLL для Проводника) собирает Visual Studio; MinGW вкладывает её в GhostStyle.exe
      - name: Build taskbar engine
        shell: pwsh
        run: |
          cmake -S Native/modules/taskbar/engine -B Native/modules/taskbar/engine/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'cmake: настройка движка не удалась' }
          cmake --build Native/modules/taskbar/engine/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake: сборка движка не удалась' }
          if (-not (Test-Path Native/modules/taskbar/engine/out/GhostShellTap.dll)) { throw 'GhostShellTap.dll не появился' }

      - name: Build (MinGW-w64)
        shell: pwsh
        run: |
          $env:PATH = 'C:\mingw64\bin;' + $env:PATH
          cmake -S Native -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ "-DGS_TAP_DLL=$($PWD.Path -replace '\\','/')/Native/modules/taskbar/engine/out/GhostShellTap.dll"
          if ($LASTEXITCODE -ne 0) { throw 'cmake не вышел' }
          cmake --build build --target GhostStyle sp_logic_test
          if ($LASTEXITCODE -ne 0) { throw 'сборка не вышла' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/out/GhostStyle.exe dist/GhostStyle.debug.exe
          strip build/out/GhostStyle.exe build/out/sp_logic_test.exe
          Copy-Item build/out/GhostStyle.exe, build/out/sp_logic_test.exe dist/
          $h = (Get-FileHash dist/GhostStyle.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist/GhostStyle.exe.sha256 -Value "$h  GhostStyle.exe" -NoNewline
          Get-ChildItem dist | ForEach-Object { "$($_.Name) $($_.Length)" }

      - uses: actions/upload-artifact@v4
        with:
          name: native-windows
          path: dist/*
          retention-days: 30

      - name: Run native checks
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-dist | Out-Null
          Copy-Item dist/GhostStyle.exe, dist/sp_logic_test.exe native-dist/
          ./tests/e2e/native-style.ps1 -Out results
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-e2e-results
          path: results/*

      - name: Results to branch
        if: always()
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'e2e-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item results/* $dir -Recurse -ErrorAction SilentlyContinue
          Set-Location $dir
          git init -q
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout -q -b ci-e2e-native
          git add .
          git commit -q -m 'Результаты проверки нативных приложений на Windows'
          git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          git push -q --force origin ci-e2e-native
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
