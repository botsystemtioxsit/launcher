name: Test plugins on Windows

# Проверка плагинов на настоящей Windows-машине GitHub (не на компьютере владельца: сборка Windows и набор программ другие,
# но панель задач, Проводник и окна — настоящие). Запускается вручную; результат — папка в ветке ci-e2e (плагины)
# или ci-e2e-bg (опыты с прозрачным фоном): отчёт report.txt, журналы, дерево элементов панели и снимки экрана.
on:
  workflow_dispatch:
    inputs:
      scenario:
        description: 'plugins — проверка плагина панели; bg — опыты с прозрачным фоном окон; glass — опыты со «стеклом» под окном'
        default: plugins
        type: choice
        options: [plugins, bg, glass, site, icons, store, startapps, taskbar, wallpaper, colorplus, cursor, gateway, gateway-ssh, browser, skins, dns, gsp, loc]

permissions:
  contents: write

jobs:
  test:
    if: inputs.scenario != 'gateway-ssh'
    runs-on: windows-latest
    env:
      SCENARIO: ${{ inputs.scenario || 'plugins' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        if: env.SCENARIO == 'plugins' || env.SCENARIO == 'icons' || env.SCENARIO == 'startapps' || env.SCENARIO == 'taskbar' || env.SCENARIO == 'wallpaper' || env.SCENARIO == 'colorplus' || env.SCENARIO == 'cursor' || env.SCENARIO == 'gateway' || env.SCENARIO == 'browser' || env.SCENARIO == 'skins' || env.SCENARIO == 'dns' || env.SCENARIO == 'loc'
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-go@v5
        if: env.SCENARIO == 'gsp' || env.SCENARIO == 'gateway'
        with:
          go-version: '1.24'
          cache-dependency-path: Protocols/Gsp/go.sum

      # Клиент GSP (Go) + wintun.dll: сетевая карта шлюза. wintun.dll — подписанная библиотека WireGuard LLC; скачиваем с wintun.net, сверяем сумму и подпись.
      - name: Build GSP and fetch wintun
        if: env.SCENARIO == 'gsp' || env.SCENARIO == 'gateway'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out-test | Out-Null
          Push-Location Protocols/Gsp
          go build -o ../../out-test/gsp.exe .
          if ($LASTEXITCODE -ne 0) { throw 'go build не удался' }
          Pop-Location
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Write-Host "wintun-0.14.1.zip sha256: $h"
          if ($h -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw "сумма wintun не совпала: $h" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'wintun') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun/wintun/bin/amd64/wintun.dll') out-test/wintun.dll
          # Gateway Plus вкладывает gsp.exe и wintun.dll в себя (см. GatewayPlus.csproj)
          New-Item -ItemType Directory -Force Plugins/GatewayPlus/Resources/bin | Out-Null
          Copy-Item out-test/gsp.exe Plugins/GatewayPlus/Resources/bin/gsp.exe
          Copy-Item out-test/wintun.dll Plugins/GatewayPlus/Resources/bin/wintun.dll
          $sig = Get-AuthenticodeSignature out-test/wintun.dll
          Write-Host "подпись wintun.dll: $($sig.Status) $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard') { throw 'подпись wintun.dll не подтвердилась' }

      - name: Build engine
        if: env.SCENARIO == 'plugins' || env.SCENARIO == 'taskbar' || env.SCENARIO == 'colorplus' || env.SCENARIO == 'skins' || env.SCENARIO == 'loc'
        shell: pwsh
        run: |
          cmake -S Plugins/TaskbarPlus/Engine -B Plugins/TaskbarPlus/Engine/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'cmake: настройка не удалась' }
          cmake --build Plugins/TaskbarPlus/Engine/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake: сборка не удалась' }

      - name: Publish plugins
        if: env.SCENARIO == 'plugins' || env.SCENARIO == 'taskbar' || env.SCENARIO == 'colorplus'
        shell: pwsh
        run: |
          foreach ($p in 'TaskbarPlus') {
            dotnet publish Plugins/$p/$p.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
            if ($LASTEXITCODE -ne 0) { throw "publish $p не удался" }
          }

      - name: Publish Color Plus
        if: env.SCENARIO == 'colorplus'
        shell: pwsh
        run: |
          dotnet publish Plugins/ColorPlus/ColorPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish ColorPlus не удался' }

      - name: Publish Wallpaper Plus
        if: env.SCENARIO == 'wallpaper'
        shell: pwsh
        run: |
          dotnet publish Plugins/WallpaperPlus/WallpaperPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish WallpaperPlus не удался' }

      - name: Publish Cursor Plus
        if: env.SCENARIO == 'cursor'
        shell: pwsh
        run: |
          dotnet publish Plugins/CursorPlus/CursorPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish CursorPlus не удался' }

      - name: Publish Gateway Plus
        if: env.SCENARIO == 'gateway'
        shell: pwsh
        run: |
          dotnet publish Plugins/GatewayPlus/GatewayPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish GatewayPlus не удался' }

      # Языки интерфейса: публикуем лаунчер и все плагины в одну папку и просим каждый нарисовать окна с --lang=en / --lang=de
      - name: Publish launcher and all plugins
        if: env.SCENARIO == 'loc'
        shell: pwsh
        run: |
          dotnet publish Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish Launcher не удался' }
          foreach ($p in 'GatewayPlus','IconPlus','WallpaperPlus','TaskbarPlus','SkinLoader','CursorPlus','ColorPlus','DnsPlus') {
            dotnet publish Plugins/$p/$p.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
            if ($LASTEXITCODE -ne 0) { throw "publish $p не удался" }
          }

      - name: Publish DNS Plus
        if: env.SCENARIO == 'dns'
        shell: pwsh
        run: |
          dotnet publish Plugins/DnsPlus/DnsPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish DnsPlus не удался' }

      # Skin Loader применяет скин через установленные плагины — ставим их туда же, куда их ставит лаунчер (%LOCALAPPDATA%\Programs\<Имя>)
      - name: Publish plugins and Skin Loader
        if: env.SCENARIO == 'skins'
        shell: pwsh
        run: |
          foreach ($p in 'TaskbarPlus','ColorPlus','IconPlus','WallpaperPlus','CursorPlus') {
            dotnet publish Plugins/$p/$p.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o "$env:LOCALAPPDATA/Programs/$p"
            if ($LASTEXITCODE -ne 0) { throw "publish $p не удался" }
          }
          dotnet publish Plugins/SkinLoader/SkinLoader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish SkinLoader не удался' }

      - name: Publish launcher
        if: env.SCENARIO == 'browser'
        shell: pwsh
        run: |
          dotnet publish Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish Launcher не удался' }

      - name: Publish Icon Plus
        if: env.SCENARIO == 'icons' || env.SCENARIO == 'startapps'
        shell: pwsh
        run: |
          dotnet publish Plugins/IconPlus/IconPlus.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-test
          if ($LASTEXITCODE -ne 0) { throw 'publish IconPlus не удался' }

      - name: Run checks
        shell: pwsh
        run: |
          if ($env:SCENARIO -eq 'bg') { ./tests/e2e/bg-experiment.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'glass') { ./tests/e2e/glass-experiment.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'site') { ./tests/e2e/site-probe.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'icons') { ./tests/e2e/icon-plus.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'store') { ./tests/e2e/store-probe.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'startapps') { ./tests/e2e/startapps.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'taskbar') { ./tests/e2e/taskbar-states.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'wallpaper') { ./tests/e2e/wallpaper.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'colorplus') { ./tests/e2e/color-plus.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'cursor') { ./tests/e2e/cursor-plus.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'gateway') { ./tests/e2e/gateway-plus.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'browser') { ./tests/e2e/browser-plugins.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'skins') { ./tests/e2e/skin-loader.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'dns') { ./tests/e2e/dns-plus.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'gsp') { ./tests/e2e/gsp-windows.ps1 -Out results }
          elseif ($env:SCENARIO -eq 'loc') { ./tests/e2e/loc.ps1 -Out results }
          else { ./tests/e2e/run.ps1 -Out results }
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: results/*

      - name: Results to branch
        if: always()
        shell: pwsh
        run: |
          $branch = if ($env:SCENARIO -eq 'bg') { 'ci-e2e-bg' } elseif ($env:SCENARIO -eq 'glass') { 'ci-e2e-glass' } elseif ($env:SCENARIO -eq 'site') { 'ci-e2e-site' } elseif ($env:SCENARIO -eq 'icons') { 'ci-e2e-icons' } elseif ($env:SCENARIO -eq 'store') { 'ci-e2e-store' } elseif ($env:SCENARIO -eq 'startapps') { 'ci-e2e-startapps' } elseif ($env:SCENARIO -eq 'taskbar') { 'ci-e2e-taskbar' } elseif ($env:SCENARIO -eq 'gpu') { 'ci-e2e-gpu' } elseif ($env:SCENARIO -eq 'extend') { 'ci-e2e-extend' } elseif ($env:SCENARIO -eq 'accent') { 'ci-e2e-accent' } elseif ($env:SCENARIO -eq 'wallpaper') { 'ci-e2e-wallpaper' } elseif ($env:SCENARIO -eq 'colorplus') { 'ci-e2e-colorplus' } elseif ($env:SCENARIO -eq 'cursor') { 'ci-e2e-cursor' } elseif ($env:SCENARIO -eq 'gateway') { 'ci-e2e-gateway' } elseif ($env:SCENARIO -eq 'browser') { 'ci-e2e-browser' } elseif ($env:SCENARIO -eq 'skins') { 'ci-e2e-skins' } elseif ($env:SCENARIO -eq 'dns') { 'ci-e2e-dns' } elseif ($env:SCENARIO -eq 'gsp') { 'ci-e2e-gsp' } elseif ($env:SCENARIO -eq 'loc') { 'ci-e2e-loc' } else { 'ci-e2e' }
          $dir = Join-Path $env:RUNNER_TEMP 'e2e-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item results/* $dir -Recurse -ErrorAction SilentlyContinue
          Set-Location $dir
          git init -q
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout -q -b $branch
          git add .
          git commit -q -m 'Результаты проверки на Windows'
          git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          git push -q --force origin $branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Мастер «Создать свой VPN» против настоящего sshd (Linux-машина GitHub): Plugins/GatewayPlus.SshTest берёт тот же код мастера (Provisioner.cs) и настоящий
  # скрипт сервера и проходит: недоступный порт, неверный пароль, отпечаток (первый раз / знакомый / изменился / отказ), установка по ключу под обычным
  # пользователем с sudo, повторный запуск. Результат — в журнале job'а (без отдельной ветки).
  gateway-ssh:
    if: inputs.scenario == 'gateway-ssh'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: Protocols/Gsp/go.sum

      - name: Сборка gsp для сервера
        run: |
          (cd Protocols/Gsp && go build -o "$RUNNER_TEMP/gsp" .)
          chmod 755 "$RUNNER_TEMP/gsp"

      - name: Настоящий sshd на этой машине + ключ
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-server
          ssh-keygen -t ed25519 -N '' -q -f "$RUNNER_TEMP/gwkey"
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat "$RUNNER_TEMP/gwkey.pub" >> ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
          sudo systemctl enable --now ssh
          sudo systemctl status ssh --no-pager | head -5 || true
          FPS=""
          for f in /etc/ssh/ssh_host_*_key.pub; do FPS="$FPS,$(ssh-keygen -lf "$f" | awk '{print $2}')"; done
          echo "FPS=${FPS#,}" >> "$GITHUB_ENV"
          echo "известные отпечатки: ${FPS#,}"

      - name: Проверка мастера
        run: |
          dotnet run --project Plugins/GatewayPlus.SshTest -c Release -- \
            --host 127.0.0.1 --port 22 --user "$USER" --key "$RUNNER_TEMP/gwkey" --fps "$FPS" --out "$RUNNER_TEMP/ssh-results" --gsp-bin "$RUNNER_TEMP/gsp"

      - name: Что осталось на «сервере»
        if: always()
        run: |
          echo "--- wg show ---"; sudo wg show || true
          echo "--- /etc/wireguard ---"; sudo ls -la /etc/wireguard || true
          echo "--- следы скрипта в /tmp (должно быть пусто) ---"; ls -la /tmp/ghostshell-gateway-* 2>&1 || echo "пусто"
          echo "--- ip addr show wg0 ---"; ip addr show wg0 || true
          echo "--- правило размера пакетов IPv4 в wg0.conf (должно быть ровно в одной строке PostUp) ---"; sudo grep -c '^PostUp = iptables .*TCPMSS' /etc/wireguard/wg0.conf || true
          echo "--- ещё запуски: следы скрипта ускорения (должно быть пусто) ---"; ls -la /tmp/ghostshell-tune-* 2>&1 || echo "пусто"
