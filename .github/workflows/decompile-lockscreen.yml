name: Decompile Lock Screen Custom Plus

# Разовая задача: разобрать старый APK «Lock Screen Custom Plus» (лежит в ветке ccr-03b67940-mzxakd) декомпилятором jadx
# и положить читаемые исходники рядом (LockScreenPlus/decompiled). Запускается вручную и только на ветке ccr-03b67940-mzxakd.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decompile:
    if: github.ref_name == 'ccr-03b67940-mzxakd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download jadx
        run: |
          curl -fsSL -o jadx.zip https://github.com/skylot/jadx/releases/download/v1.5.1/jadx-1.5.1.zip
          unzip -q jadx.zip -d jadx
      - name: Decompile
        run: |
          APK=$(ls LockScreenPlus/original/*.apk | head -1)
          echo "APK: $APK"
          rm -rf LockScreenPlus/decompiled
          # jadx возвращает ошибку, если часть методов не удалось восстановить; результат при этом сохраняется
          jadx/jadx/bin/jadx -e --show-bad-code -d LockScreenPlus/decompiled "$APK" || echo "jadx закончил с предупреждениями (это нормально)"
          ls LockScreenPlus/decompiled
      - name: Keep only the app code
        run: |
          J=LockScreenPlus/decompiled/app/src/main/java
          # из чужих библиотек (androidx, google, firebase…) оставляем только пакет приложения
          if [ -d "$J" ]; then
            find "$J" -mindepth 1 -maxdepth 1 ! -name com -exec rm -rf {} +
            find "$J/com" -mindepth 1 -maxdepth 1 ! -name lockscreen -exec rm -rf {} +
          fi
          rm -rf LockScreenPlus/decompiled/app/src/main/jniLibs
          du -sh LockScreenPlus/decompiled
          find LockScreenPlus/decompiled -name '*.java' | wc -l
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add LockScreenPlus/decompiled
          git commit -m "Исходники Lock Screen Custom Plus (jadx)" || echo "нечего коммитить"
          git push origin HEAD:ccr-03b67940-mzxakd
