name: Decompile Lock Screen Custom Plus

# Разовая сверка восстановленного кода: старый APK из LockScreenPlus/original разбирается ВТОРЫМ декомпилятором (CFR),
# результат кладётся в LockScreenPlus/crosscheck — им сверяют места, которые первый декомпилятор (jadx) восстановил с искажениями.
# Запускается вручную и только на рабочей ветке.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crosscheck:
    if: github.ref_name == 'ccr-03b67940-mzxakd'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download tools
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          D2J_URL=$(gh api repos/ThexXTURBOXx/dex2jar/releases/latest --jq '.assets[] | select(.name | test("dex-tools.*zip$")) | .browser_download_url' | head -1)
          CFR_URL=$(gh api repos/leibnitz27/cfr/releases/latest --jq '.assets[] | select(.name | test("^cfr-[0-9.]+\\.jar$")) | .browser_download_url' | head -1)
          gh api repos/ThexXTURBOXx/dex2jar/releases/latest --jq '.assets[].name' || true
          echo "dex2jar: $D2J_URL"
          echo "cfr: $CFR_URL"
          curl -fsSL -o dex2jar.zip "$D2J_URL"
          unzip -q dex2jar.zip -d tools
          curl -fsSL -o cfr.jar "$CFR_URL"
          ls tools
      - name: APK to jar to Java
        run: |
          APK=$(ls LockScreenPlus/original/*.apk | head -1)
          D2J=$(find tools -name d2j-dex2jar.sh | head -1)
          chmod +x "$D2J" $(dirname "$D2J")/*.sh
          "$D2J" -f -o app.jar "$APK" || echo "dex2jar закончил с предупреждениями"
          rm -rf LockScreenPlus/crosscheck
          java -jar cfr.jar app.jar --outputdir LockScreenPlus/crosscheck --jarfilter 'com\.lockscreen\.customplus\..*' --silent true || echo "cfr закончил с предупреждениями"
          find LockScreenPlus/crosscheck -name '*.java' | wc -l
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add LockScreenPlus/crosscheck
          git commit -m "Lock Screen Custom Plus: сверочная декомпиляция (CFR)" || echo "нечего коммитить"
          git push origin HEAD:ccr-03b67940-mzxakd
