name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Launcher/**'
      - 'Shared/**'
      - 'Terminal/**'
      - 'Plugins/**'
      - 'BrowserPlugins/**'
      - 'tools/mask-plus/**'
      - 'Protocols/Gsp/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Движок панели задач Windows 11 (C++ DLL, подключается к панели в Проводнике). Собираем первым — если не соберётся, дальше идти незачем.
      # Файл вкладывается в GhostStyle.exe (модуль «Панель»), отдельно его скачивать не нужно.
      - name: Build taskbar engine
        shell: pwsh
        run: |
          cmake -S Native/modules/taskbar/engine -B Native/modules/taskbar/engine/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'cmake: настройка не удалась' }
          cmake --build Native/modules/taskbar/engine/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake: сборка движка не удалась' }
          if (-not (Test-Path Native/modules/taskbar/engine/out/GhostShellTap.dll)) { throw 'GhostShellTap.dll не появился' }
          Get-Item Native/modules/taskbar/engine/out/GhostShellTap.dll | Select-Object Name, Length

      # Один самодостаточный .exe: .NET внутри, ставить ничего на компьютер не нужно.
      - name: Publish
        run: >
          dotnet publish Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:TieredPGO=false -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/BattleLauncher.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/BattleLauncher.exe.sha256 -Value "$h  BattleLauncher.exe" -NoNewline

      # Терминал (админ-панель в виде настоящего приложения) — тоже один самодостаточный .exe, в том же релизе
      - name: Publish Terminal
        run: >
          dotnet publish Terminal/Terminal.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:TieredPGO=false -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-terminal

      - name: Checksum Terminal
        shell: pwsh
        run: |
          Copy-Item out-terminal/TIOXSITTerminal.exe out/TIOXSITTerminal.exe
          $h = (Get-FileHash out/TIOXSITTerminal.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/TIOXSITTerminal.exe.sha256 -Value "$h  TIOXSITTerminal.exe" -NoNewline

      # Плагины лаунчера — отдельные программы (скачиваются из лаунчера только по кнопке), тоже в этом релизе
      # DNS Plus — защищённый DNS (NextDNS) для всей Windows: ID + кнопка «Включить»
      - name: Publish DNS Plus
        run: >
          dotnet publish Plugins/DnsPlus/DnsPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:TieredPGO=false -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-dnsplus

      - name: Checksum DNS Plus
        shell: pwsh
        run: |
          Copy-Item out-dnsplus/DnsPlus.exe out/DnsPlus.exe
          $h = (Get-FileHash out/DnsPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/DnsPlus.exe.sha256 -Value "$h  DnsPlus.exe" -NoNewline

      # GSP — свой протокол Gateway Plus (Protocols/Gsp, Go). Windows-клиент gsp.exe и wintun.dll (сетевая карта, подписана WireGuard LLC) вкладываются в GatewayPlus.exe;
      # серверные программы gsp-linux-* кладутся в релиз рядом (их скачивает скрипт, который мастер запускает на сервере, и проверяет по .sha256).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: Protocols/Gsp/go.sum

      - name: Build GSP and fetch wintun
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          New-Item -ItemType Directory -Force Plugins/GatewayPlus/Resources/bin | Out-Null
          Push-Location Protocols/Gsp
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'go vet не прошёл' }
          go build -trimpath -ldflags '-s -w' -o ../../Plugins/GatewayPlus/Resources/bin/gsp.exe .
          if ($LASTEXITCODE -ne 0) { throw 'go build (Windows) не удался' }
          foreach ($arch in 'amd64','arm64') {
            $env:GOOS = 'linux'; $env:GOARCH = $arch; $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags '-s -w' -o "../../out/gsp-linux-$arch" .
            if ($LASTEXITCODE -ne 0) { throw "go build (linux $arch) не удался" }
          }
          Remove-Item Env:GOOS, Env:GOARCH, Env:CGO_ENABLED
          Pop-Location
          foreach ($arch in 'amd64','arm64') {
            $h = (Get-FileHash "out/gsp-linux-$arch" -Algorithm SHA256).Hash.ToLower()
            Set-Content -Path "out/gsp-linux-$arch.sha256" -Value "$h  gsp-linux-$arch" -NoNewline
          }
          $zip = Join-Path $env:RUNNER_TEMP 'wintun.zip'
          Invoke-WebRequest -Uri 'https://www.wintun.net/builds/wintun-0.14.1.zip' -OutFile $zip
          $h = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($h -ne '07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51') { throw "сумма wintun не совпала: $h" }
          Expand-Archive $zip -DestinationPath (Join-Path $env:RUNNER_TEMP 'wintun') -Force
          Copy-Item (Join-Path $env:RUNNER_TEMP 'wintun/wintun/bin/amd64/wintun.dll') Plugins/GatewayPlus/Resources/bin/wintun.dll
          $sig = Get-AuthenticodeSignature Plugins/GatewayPlus/Resources/bin/wintun.dll
          if ($sig.Status -ne 'Valid' -or $sig.SignerCertificate.Subject -notmatch 'WireGuard') { throw 'подпись wintun.dll не подтвердилась' }
          Get-ChildItem Plugins/GatewayPlus/Resources/bin, out/gsp-linux-* | Select-Object Name, Length

      # Gateway Plus — шестой плагин: шлюз (WireGuard или свой протокол GSP): сайты видят адрес и страну вашего сервера
      - name: Publish Gateway Plus
        run: >
          dotnet publish Plugins/GatewayPlus/GatewayPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:TieredPGO=false -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-gatewayplus

      - name: Checksum Gateway Plus
        shell: pwsh
        run: |
          Copy-Item out-gatewayplus/GatewayPlus.exe out/GatewayPlus.exe
          $h = (Get-FileHash out/GatewayPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/GatewayPlus.exe.sha256 -Value "$h  GatewayPlus.exe" -NoNewline

      # Ghost Style — нативное (C++) приложение-комбайн оформления: сезоны, курсор, цвет… (MinGW-w64, один маленький exe без .NET)
      - name: Build Ghost Style (C++)
        shell: pwsh
        run: |
          $env:PATH = 'C:\mingw64\bin;' + $env:PATH
          cmake -S Native -B build-native -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ "-DGS_TAP_DLL=$($PWD.Path -replace '\\','/')/Native/modules/taskbar/engine/out/GhostShellTap.dll"
          if ($LASTEXITCODE -ne 0) { throw 'cmake для Ghost Style не вышел' }
          cmake --build build-native --target GhostStyle
          if ($LASTEXITCODE -ne 0) { throw 'сборка Ghost Style не вышла' }
          strip build-native/out/GhostStyle.exe
          Copy-Item build-native/out/GhostStyle.exe out/GhostStyle.exe
          $h = (Get-FileHash out/GhostStyle.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/GhostStyle.exe.sha256 -Value "$h  GhostStyle.exe" -NoNewline

      # Mask Plus — расширение для браузера (Chrome, Edge, Brave…): один zip с контрольной суммой.
      # Лаунчер скачивает его во вкладке «Плагины → Для браузера». Архив детерминированный: пока файлы те же, сумма та же.
      - name: Package Mask Plus extension
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/mask-plus/generate.py
          if ($LASTEXITCODE -ne 0) { throw 'generate.py не отработал' }
          python tools/mask-plus/pack.py out
          if ($LASTEXITCODE -ne 0) { throw 'pack.py не отработал' }
          Get-ChildItem out/MaskPlus-extension.zip*

      # Честные скриншоты самого лаунчера для Microsoft Store: служебный режим --screenshot открывает
      # настоящие окна (с выдуманными данными, без сети) и сохраняет их в PNG.
      - name: Скриншоты лаунчера
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process out/BattleLauncher.exe -ArgumentList '--screenshot=shots' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Скриншоты: лаунчер не завершился за 2 минуты' }
          $p2 = Start-Process out-terminal/TIOXSITTerminal.exe -ArgumentList '--screenshot=shots' -PassThru
          if (-not $p2.WaitForExit(90000)) { $p2.Kill(); Write-Warning 'Скриншот Терминала: не завершился за 90 секунд' }
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-screenshots
          path: shots/*.png

      # Копия снимков в служебной ветке ci-screenshots — чтобы их можно было забрать без входа в Actions
      - name: Снимки в ветку ci-screenshots
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'shots-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item shots/*.png $dir
          Copy-Item shots/*.txt $dir -ErrorAction SilentlyContinue
          Set-Location $dir
          git init -q
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout -q -b ci-screenshots
          git add .
          git commit -q -m 'Скриншоты лаунчера'
          git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          git push -q --force origin ci-screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Не из main — просто проверка, что всё собирается; файл лежит в артефактах запуска.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: BattleLauncher
          path: |
            out/BattleLauncher.exe*
            out/TIOXSITTerminal.exe*
            out/DnsPlus.exe*
            out/GatewayPlus.exe*
            out/gsp-linux-*
            out/GhostStyle.exe*
            out/MaskPlus-extension.zip*

      # Из main — выпуск: релиз v<версия из Launcher.csproj>. Версию поднимай в csproj:
      # пока она та же, файлы в релизе просто перезаписываются.
      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Select-String -Path Launcher/Launcher.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" out/BattleLauncher.exe out/BattleLauncher.exe.sha256 out/TIOXSITTerminal.exe out/TIOXSITTerminal.exe.sha256 out/DnsPlus.exe out/DnsPlus.exe.sha256 out/GatewayPlus.exe out/GatewayPlus.exe.sha256 out/gsp-linux-amd64 out/gsp-linux-amd64.sha256 out/gsp-linux-arm64 out/gsp-linux-arm64.sha256 out/GhostStyle.exe out/GhostStyle.exe.sha256 out/MaskPlus-extension.zip out/MaskPlus-extension.zip.sha256 --clobber
          } else {
            gh release create "v$v" out/BattleLauncher.exe out/BattleLauncher.exe.sha256 out/TIOXSITTerminal.exe out/TIOXSITTerminal.exe.sha256 out/DnsPlus.exe out/DnsPlus.exe.sha256 out/GatewayPlus.exe out/GatewayPlus.exe.sha256 out/gsp-linux-amd64 out/gsp-linux-amd64.sha256 out/gsp-linux-arm64 out/gsp-linux-arm64.sha256 out/GhostStyle.exe out/GhostStyle.exe.sha256 out/MaskPlus-extension.zip out/MaskPlus-extension.zip.sha256 --title "Лаунчер $v" --notes "BattleLauncher.exe — лаунчер (скачай и запусти). TIOXSITTerminal.exe — Терминал, админ-панель в виде приложения. DnsPlus.exe — плагин DNS Plus, GatewayPlus.exe — плагин Gateway Plus (внутри него Windows-клиент GSP), gsp-linux-amd64 / gsp-linux-arm64 — серверная программа GSP (её скачивает скрипт установки сервера, ставить вручную не нужно), GhostStyle.exe — приложение Ghost Style, все оформление в одном (ставятся из лаунчера, вкладка «Плагины → Для компьютера»). MaskPlus-extension.zip — расширение для браузера Mask Plus (вкладка «Плагины → Для браузера»)."
          }
