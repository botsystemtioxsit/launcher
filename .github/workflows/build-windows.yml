name: Build Windows launcher

on:
  workflow_dispatch:
  push:
    paths:
      - 'Launcher/**'
      - 'Terminal/**'
      - 'Plugins/**'
      - 'BrowserPlugins/**'
      - 'tools/mask-plus/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Движок Taskbar Plus для Windows 11 (C++ DLL, подключается к панели задач). Собираем первым — если не соберётся, дальше идти незачем.
      # Файл вкладывается в TaskbarPlus.exe (см. TaskbarPlus.csproj), отдельно его скачивать не нужно.
      - name: Build Taskbar Plus engine
        shell: pwsh
        run: |
          cmake -S Plugins/TaskbarPlus/Engine -B Plugins/TaskbarPlus/Engine/build -A x64
          if ($LASTEXITCODE -ne 0) { throw 'cmake: настройка не удалась' }
          cmake --build Plugins/TaskbarPlus/Engine/build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'cmake: сборка движка не удалась' }
          if (-not (Test-Path Plugins/TaskbarPlus/Engine/out/GhostShellTap.dll)) { throw 'GhostShellTap.dll не появился' }
          Get-Item Plugins/TaskbarPlus/Engine/out/GhostShellTap.dll | Select-Object Name, Length

      # Один самодостаточный .exe: .NET внутри, ставить ничего на компьютер не нужно.
      - name: Publish
        run: >
          dotnet publish Launcher/Launcher.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out

      - name: Checksum
        shell: pwsh
        run: |
          $h = (Get-FileHash out/BattleLauncher.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/BattleLauncher.exe.sha256 -Value "$h  BattleLauncher.exe" -NoNewline

      # Терминал (админ-панель в виде настоящего приложения) — тоже один самодостаточный .exe, в том же релизе
      - name: Publish Terminal
        run: >
          dotnet publish Terminal/Terminal.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-terminal

      - name: Checksum Terminal
        shell: pwsh
        run: |
          Copy-Item out-terminal/TIOXSITTerminal.exe out/TIOXSITTerminal.exe
          $h = (Get-FileHash out/TIOXSITTerminal.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/TIOXSITTerminal.exe.sha256 -Value "$h  TIOXSITTerminal.exe" -NoNewline

      # Плагины лаунчера — отдельные программы (скачиваются из лаунчера только по кнопке), тоже в этом релизе
      - name: Publish Taskbar Plus
        run: >
          dotnet publish Plugins/TaskbarPlus/TaskbarPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-taskbarplus

      # Проверка: движок действительно вложен в TaskbarPlus.exe (иначе «Новый движок» в плагине был бы пустой кнопкой)
      - name: Check engine embedded in Taskbar Plus
        shell: pwsh
        run: |
          $dll = Get-ChildItem Plugins/TaskbarPlus/obj -Recurse -Filter TaskbarPlus.dll | Select-Object -First 1
          if (-not $dll) { throw 'TaskbarPlus.dll не найден в obj' }
          $names = [Reflection.Assembly]::Load([IO.File]::ReadAllBytes($dll.FullName)).GetManifestResourceNames()
          Write-Host ('Ресурсы: ' + ($names -join ', '))
          if ($names -notcontains 'GhostShellTap.dll') { throw 'GhostShellTap.dll не вложен в плагин' }

      - name: Checksum Taskbar Plus
        shell: pwsh
        run: |
          Copy-Item out-taskbarplus/TaskbarPlus.exe out/TaskbarPlus.exe
          $h = (Get-FileHash out/TaskbarPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/TaskbarPlus.exe.sha256 -Value "$h  TaskbarPlus.exe" -NoNewline

      # Color Plus — один цвет для окон, выделения и панели задач (с предпросмотром)
      - name: Publish Color Plus
        run: >
          dotnet publish Plugins/ColorPlus/ColorPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-colorplus

      - name: Checksum Color Plus
        shell: pwsh
        run: |
          Copy-Item out-colorplus/ColorPlus.exe out/ColorPlus.exe
          $h = (Get-FileHash out/ColorPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/ColorPlus.exe.sha256 -Value "$h  ColorPlus.exe" -NoNewline

      # Icon Plus — третий плагин: значки Windows одним цветом или из готового набора, сайт с иконками во встроенном браузере
      - name: Publish Icon Plus
        run: >
          dotnet publish Plugins/IconPlus/IconPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-iconplus

      - name: Checksum Icon Plus
        shell: pwsh
        run: |
          Copy-Item out-iconplus/IconPlus.exe out/IconPlus.exe
          $h = (Get-FileHash out/IconPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/IconPlus.exe.sha256 -Value "$h  IconPlus.exe" -NoNewline

      # Wallpaper Plus — четвёртый плагин: живые обои рабочего стола (видео, GIF, страницы), каталог, сайты, конструктор
      - name: Publish Wallpaper Plus
        run: >
          dotnet publish Plugins/WallpaperPlus/WallpaperPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-wallpaperplus

      - name: Checksum Wallpaper Plus
        shell: pwsh
        run: |
          Copy-Item out-wallpaperplus/WallpaperPlus.exe out/WallpaperPlus.exe
          $h = (Get-FileHash out/WallpaperPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/WallpaperPlus.exe.sha256 -Value "$h  WallpaperPlus.exe" -NoNewline

      # Cursor Plus — пятый плагин: свой курсор (цвет, форма, свой рисунок), шлейф и эффекты клика
      - name: Publish Cursor Plus
        run: >
          dotnet publish Plugins/CursorPlus/CursorPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-cursorplus

      - name: Checksum Cursor Plus
        shell: pwsh
        run: |
          Copy-Item out-cursorplus/CursorPlus.exe out/CursorPlus.exe
          $h = (Get-FileHash out/CursorPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/CursorPlus.exe.sha256 -Value "$h  CursorPlus.exe" -NoNewline

      # DNS Plus — защищённый DNS (NextDNS) для всей Windows: ID + кнопка «Включить»
      - name: Publish DNS Plus
        run: >
          dotnet publish Plugins/DnsPlus/DnsPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-dnsplus

      - name: Checksum DNS Plus
        shell: pwsh
        run: |
          Copy-Item out-dnsplus/DnsPlus.exe out/DnsPlus.exe
          $h = (Get-FileHash out/DnsPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/DnsPlus.exe.sha256 -Value "$h  DnsPlus.exe" -NoNewline

      # Gateway Plus — шестой плагин: шлюз (WireGuard): сайты видят адрес и страну вашего сервера
      - name: Publish Gateway Plus
        run: >
          dotnet publish Plugins/GatewayPlus/GatewayPlus.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-gatewayplus

      - name: Checksum Gateway Plus
        shell: pwsh
        run: |
          Copy-Item out-gatewayplus/GatewayPlus.exe out/GatewayPlus.exe
          $h = (Get-FileHash out/GatewayPlus.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/GatewayPlus.exe.sha256 -Value "$h  GatewayPlus.exe" -NoNewline

      # Skin Loader — седьмой плагин: скины Windows (набор настроек остальных плагинов), сборка, применение, файл .ghostskin
      - name: Publish Skin Loader
        run: >
          dotnet publish Plugins/SkinLoader/SkinLoader.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none -o out-skinloader

      - name: Checksum Skin Loader
        shell: pwsh
        run: |
          Copy-Item out-skinloader/SkinLoader.exe out/SkinLoader.exe
          $h = (Get-FileHash out/SkinLoader.exe -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path out/SkinLoader.exe.sha256 -Value "$h  SkinLoader.exe" -NoNewline

      # Mask Plus — расширение для браузера (Chrome, Edge, Brave…): один zip с контрольной суммой.
      # Лаунчер скачивает его во вкладке «Плагины → Для браузера». Архив детерминированный: пока файлы те же, сумма та же.
      - name: Package Mask Plus extension
        shell: pwsh
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python tools/mask-plus/generate.py
          if ($LASTEXITCODE -ne 0) { throw 'generate.py не отработал' }
          python tools/mask-plus/pack.py out
          if ($LASTEXITCODE -ne 0) { throw 'pack.py не отработал' }
          Get-ChildItem out/MaskPlus-extension.zip*

      # Честные скриншоты самого лаунчера для Microsoft Store: служебный режим --screenshot открывает
      # настоящие окна (с выдуманными данными, без сети) и сохраняет их в PNG.
      - name: Скриншоты лаунчера
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force shots | Out-Null
          $p = Start-Process out/BattleLauncher.exe -ArgumentList '--screenshot=shots' -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw 'Скриншоты: лаунчер не завершился за 2 минуты' }
          $p2 = Start-Process out-terminal/TIOXSITTerminal.exe -ArgumentList '--screenshot=shots' -PassThru
          if (-not $p2.WaitForExit(90000)) { $p2.Kill(); Write-Warning 'Скриншот Терминала: не завершился за 90 секунд' }
          Get-ChildItem shots

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-screenshots
          path: shots/*.png

      # Копия снимков в служебной ветке ci-screenshots — чтобы их можно было забрать без входа в Actions
      - name: Снимки в ветку ci-screenshots
        if: github.ref != 'refs/heads/main'
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'shots-branch'
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item shots/*.png $dir
          Copy-Item shots/*.txt $dir -ErrorAction SilentlyContinue
          Set-Location $dir
          git init -q
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git checkout -q -b ci-screenshots
          git add .
          git commit -q -m 'Скриншоты лаунчера'
          git remote add origin "https://x-access-token:$($env:GH_TOKEN)@github.com/${{ github.repository }}.git"
          git push -q --force origin ci-screenshots
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Не из main — просто проверка, что всё собирается; файл лежит в артефактах запуска.
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: BattleLauncher
          path: |
            out/BattleLauncher.exe*
            out/TIOXSITTerminal.exe*
            out/TaskbarPlus.exe*
            out/ColorPlus.exe*
            out/IconPlus.exe*
            out/WallpaperPlus.exe*
            out/CursorPlus.exe*
            out/DnsPlus.exe*
            out/GatewayPlus.exe*
            out/SkinLoader.exe*
            out/MaskPlus-extension.zip*

      # Из main — выпуск: релиз v<версия из Launcher.csproj>. Версию поднимай в csproj:
      # пока она та же, файлы в релизе просто перезаписываются.
      - name: Release
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $v = (Select-String -Path Launcher/Launcher.csproj -Pattern '<Version>(.+)</Version>').Matches[0].Groups[1].Value
          gh release view "v$v" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "v$v" out/BattleLauncher.exe out/BattleLauncher.exe.sha256 out/TIOXSITTerminal.exe out/TIOXSITTerminal.exe.sha256 out/TaskbarPlus.exe out/TaskbarPlus.exe.sha256 out/ColorPlus.exe out/ColorPlus.exe.sha256 out/IconPlus.exe out/IconPlus.exe.sha256 out/WallpaperPlus.exe out/WallpaperPlus.exe.sha256 out/CursorPlus.exe out/CursorPlus.exe.sha256 out/DnsPlus.exe out/DnsPlus.exe.sha256 out/GatewayPlus.exe out/GatewayPlus.exe.sha256 out/SkinLoader.exe out/SkinLoader.exe.sha256 out/MaskPlus-extension.zip out/MaskPlus-extension.zip.sha256 --clobber
          } else {
            gh release create "v$v" out/BattleLauncher.exe out/BattleLauncher.exe.sha256 out/TIOXSITTerminal.exe out/TIOXSITTerminal.exe.sha256 out/TaskbarPlus.exe out/TaskbarPlus.exe.sha256 out/ColorPlus.exe out/ColorPlus.exe.sha256 out/IconPlus.exe out/IconPlus.exe.sha256 out/WallpaperPlus.exe out/WallpaperPlus.exe.sha256 out/CursorPlus.exe out/CursorPlus.exe.sha256 out/DnsPlus.exe out/DnsPlus.exe.sha256 out/GatewayPlus.exe out/GatewayPlus.exe.sha256 out/SkinLoader.exe out/SkinLoader.exe.sha256 out/MaskPlus-extension.zip out/MaskPlus-extension.zip.sha256 --title "Лаунчер $v" --notes "BattleLauncher.exe — лаунчер (скачай и запусти). TIOXSITTerminal.exe — Терминал, админ-панель в виде приложения. TaskbarPlus.exe — плагин Taskbar Plus, ColorPlus.exe — плагин Color Plus, IconPlus.exe — плагин Icon Plus, WallpaperPlus.exe — плагин Wallpaper Plus, CursorPlus.exe — плагин Cursor Plus, DnsPlus.exe — плагин DNS Plus, GatewayPlus.exe — плагин Gateway Plus, SkinLoader.exe — плагин Skin Loader (ставятся из лаунчера, вкладка «Плагины → Для компьютера»). MaskPlus-extension.zip — расширение для браузера Mask Plus (вкладка «Плагины → Для браузера»)."
          }
