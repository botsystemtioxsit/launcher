name: Sync plugin reports

# Плагины (Taskbar Plus) по кнопке «Отправить отчёт разработчику» кладут отчёт в общую базу проекта (узел pluginReports).
# Узел читается без авторизации, поэтому достаточно скачать снимок и закоммитить: из песочницы Claude нет прямого выхода
# в Firebase, зато репозиторий читается — так этот процесс становится мостом между базой и разбором отчётов.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pluginReports snapshot
        run: |
          mkdir -p admin-logs
          curl -sS -f -o admin-logs/plugin-reports.json \
            "https://zolotaya-kletka-default-rtdb.firebaseio.com/pluginReports.json?print=pretty"

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add admin-logs/plugin-reports.json
          git diff --cached --quiet || git commit -m "Синхронизация отчётов плагинов"
          git push
