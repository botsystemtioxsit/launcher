name: Build Android launcher

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'
  pull_request:
    paths:
      - 'Android/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses and ensure required packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      # Постоянный ключ подписи — секрет репозитория ANDROID_KEYSTORE_BASE64 (тот же, что в репозиториях
      # игры и админ-панели). Без него каждая сборка подписана новым отладочным ключом: обновиться поверх
      # прежней версии нельзя, а Play Защита видит «незнакомого разработчика».
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/battle-signing.p12"
            {
              echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/battle-signing.p12"
              echo "ANDROID_KEYSTORE_PASSWORD=battle-android"
              echo "ANDROID_KEY_ALIAS=battle"
              echo "ANDROID_KEY_PASSWORD=battle-android"
              echo "SIGNING=stable"
            } >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug" >> "$GITHUB_ENV"
            echo "::warning::Секрет ANDROID_KEYSTORE_BASE64 не задан: APK подписан одноразовым отладочным ключом."
          fi

      - name: Build debug APK
        working-directory: Android
        run: gradle assembleDebug --no-daemon

      - name: Show signing certificate
        run: |
          APK=$(ls Android/app/build/outputs/apk/debug/*.apk | head -1)
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | grep -E "certificate (DN|SHA-256)"
          echo "Подпись: $SIGNING"

      - name: Rename APK
        run: cp Android/app/build/outputs/apk/debug/app-debug.apk Android/TIOXSITLauncher.apk

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: Android/TIOXSITLauncher.apk
          retention-days: 7

      - name: Read version
        id: ver
        run: echo "version=$(grep -o 'versionName "[^"]*"' Android/app/build.gradle | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"

      # Релиз помечен как prerelease и не «последний»: «последним» должен оставаться релиз Windows-лаунчера
      # (от него зависят самообновление и кнопка «Скачать EXE-версию»).
      - name: Publish release (main only)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Ghost Shell Launcher (Android) — последняя сборка
          prerelease: true
          make_latest: false
          files: Android/TIOXSITLauncher.apk
          body: |
            Версия ${{ steps.ver.outputs.version }}, сборка ${{ github.run_number }}, из коммита ${{ github.sha }}.
            Этот релиз всегда переиспользуется под фиксированным тегом `android-latest`.
