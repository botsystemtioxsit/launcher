plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.tioxsit.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "com.tioxsit.launcher"
        minSdk 24
        targetSdk 34
        // Версию поднимать при каждом изменении (иначе лаунчер не увидит обновление)
        versionCode 8
        versionName "1.5.0"
    }

    signingConfigs {
        // Постоянный ключ подписи из секрета репозитория ANDROID_KEYSTORE_BASE64 (тот же, что у игры и админ-панели).
        // Без него сборка подписывается одноразовым отладочным ключом — обновиться поверх прежней версии тогда нельзя.
        stable {
            def ksFile = System.getenv('ANDROID_KEYSTORE_FILE')
            if (ksFile) {
                storeFile file(ksFile)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            if (System.getenv('ANDROID_KEYSTORE_FILE')) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
}
