<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self'">
<title>БАТТЛ Лаунчер</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="update-bar" class="update-bar" hidden>
    <span id="update-text"></span>
    <button id="update-btn" class="btn small" hidden>Перезапустить и обновить</button>
  </div>

  <!-- Вход -->
  <main id="screen-login" class="screen" hidden>
    <div class="card login">
      <img src="../build/icon.png" class="logo" alt="">
      <h1>БАТТЛ Лаунчер</h1>
      <p class="muted">Войди в свой аккаунт — тот же, что в игре. Почта должна быть привязана в игре: Настройки → Аккаунт.</p>
      <div id="saved-accounts" class="accounts" hidden></div>
      <form id="login-form">
        <input id="login-email" type="email" placeholder="email аккаунта" autocomplete="email" required>
        <button id="login-btn" class="btn primary" type="submit">Запросить вход</button>
      </form>
      <p id="login-status" class="status" hidden></p>
      <p id="login-error" class="error" hidden></p>
      <button id="login-cancel" class="btn ghost" hidden>Отменить</button>
    </div>
  </main>

  <!-- Библиотека -->
  <div id="screen-app" class="shell" hidden>
    <aside class="side">
      <div class="brand"><img src="../build/icon.png" alt=""><span>БАТТЛ</span></div>
      <nav>
        <button class="nav active" data-view="library">Приложения</button>
        <button class="nav" data-view="account">Аккаунт</button>
      </nav>
      <div class="side-foot muted" id="version"></div>
    </aside>
    <main class="content">
      <section id="view-library">
        <header class="head">
          <div><h2>Приложения</h2><p class="muted" id="lib-sub"></p></div>
          <button id="refresh-btn" class="btn ghost">Проверить обновления</button>
        </header>
        <p id="no-install" class="error" hidden>Установка работает только в Windows.</p>
        <div id="app-list" class="apps"></div>
      </section>
      <section id="view-account" hidden>
        <header class="head"><div><h2>Аккаунт</h2><p class="muted">Можно держать несколько аккаунтов и переключаться между ними.</p></div></header>
        <div id="me" class="card me"></div>
        <h3>Все аккаунты</h3>
        <div id="all-accounts" class="accounts"></div>
        <div class="row">
          <button id="add-account" class="btn ghost">+ Добавить аккаунт</button>
          <button id="logout-btn" class="btn danger">Выйти</button>
        </div>
      </section>
    </main>
  </div>

  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
