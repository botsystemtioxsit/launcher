<!doctype html><html><head><meta charset="utf-8"><title>Северное сияние</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}canvas{display:block;width:100vw;height:100vh}</style></head><body>
<canvas id="c"></canvas>
<script>
const q=new URLSearchParams(location.search),P=(k,d)=>q.get(k)||d;
const c1=P('c1','#20E3A0'),c2=P('c2','#7A4DFF'),bg=P('bg','#050814'),speed=parseFloat(P('speed','1')),fps=Math.min(parseInt(P('fps','60')),40);
const cv=document.getElementById('c'),g=cv.getContext('2d');
// рисуем в небольшом холсте и растягиваем: так сияние получается мягким и почти не грузит компьютер
const W=cv.width=480,H=cv.height=270;
function rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16)||0,parseInt(h.slice(2,4),16)||0,parseInt(h.slice(4,6),16)||0]}
const A=rgb(c1),B=rgb(c2);
const stars=Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*0.9+0.2,p:Math.random()*6.28}));
let last=0,t=0;
function frame(now){requestAnimationFrame(frame);if(now-last<1000/fps-1)return;const dt=Math.min(0.1,(now-last)/1000);last=now;t+=dt*speed;
 g.globalCompositeOperation='source-over';
 const sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,bg);sky.addColorStop(1,'#0b1a2a');g.fillStyle=sky;g.fillRect(0,0,W,H);
 for(const s of stars){g.fillStyle='rgba(255,255,255,'+(0.35+0.35*Math.sin(t*1.5+s.p)).toFixed(2)+')';g.fillRect(s.x,s.y,s.r,s.r)}
 g.globalCompositeOperation='lighter';
 for(let k=0;k<3;k++){
  const col=k===1?B:A,base=H*(0.38+k*0.07);
  for(let x=0;x<W;x+=2){
   const w=Math.sin(x*0.018+t*0.7+k*1.7)*18+Math.sin(x*0.007-t*0.45+k)*28+Math.sin(x*0.04+t*1.3)*6;
   const top=base+w,h=H*(0.22+0.1*Math.sin(x*0.011+t*0.5+k*2));
   const grad=g.createLinearGradient(0,top-h,0,top+h*0.35);
   grad.addColorStop(0,'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
   grad.addColorStop(0.7,'rgba('+col[0]+','+col[1]+','+col[2]+',0.26)');
   grad.addColorStop(1,'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
   g.fillStyle=grad;g.fillRect(x,top-h,2,h*1.35);
  }
 }
}
requestAnimationFrame(frame);
</script></body></html>
