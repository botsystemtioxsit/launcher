<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI Plus — чат</title>
<style>
:root{--bg:#070314;--panel:#120a2c;--panel2:#1a0f3d;--line:#3a1f86;--text:#eaf8ff;--muted:#a08fe0;--cyan:#00f0ff;--pink:#ff2a9d;--green:#3cff9a;--yellow:#fcee0a;--red:#ff3b5c}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
button:hover{border-color:var(--cyan)}
button.primary{background:var(--cyan);color:#06050d;border-color:var(--cyan);font-weight:700}
button.danger{color:var(--red);border-color:var(--red)}
button:disabled{opacity:.5;cursor:default}
select,input,textarea{background:#0b0620;border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{resize:vertical}
label{display:block;color:var(--muted);font-size:13px;margin:12px 0 4px}
#side{width:270px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none}
#side h1{font:700 15px "Courier New",monospace;color:var(--cyan);margin:14px 14px 4px;letter-spacing:1px}
#side .sub{color:var(--muted);font-size:12px;margin:0 14px 10px}
#side .top{padding:0 12px 10px}
#chats{flex:1;overflow:auto;padding:0 8px 8px}
.chat{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;cursor:pointer;margin-bottom:2px}
.chat:hover{background:var(--panel2)}
.chat.on{background:var(--panel2);outline:1px solid var(--line)}
.chat .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat .x{opacity:.5;padding:0 6px;border:0;background:none}
.chat .x:hover{opacity:1;color:var(--red)}
#main{flex:1;display:flex;flex-direction:column;min-width:0}
#bar{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#bar .who{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
#bar .av{font-size:26px}
#bar .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar select{width:auto;max-width:190px}
#menu{display:none}
#msgs{flex:1;overflow:auto;padding:16px 14px;display:flex;flex-direction:column;gap:12px}
.m{max-width:min(760px,92%);padding:10px 14px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.user{align-self:flex-end;background:#16345a;border:1px solid #1f5a96}
.m.assistant{align-self:flex-start;background:var(--panel2);border:1px solid var(--line)}
.m .who{font-size:12px;color:var(--muted);margin-bottom:4px}
.m pre{background:#04010f;border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;margin:8px 0;white-space:pre}
.m code{font-family:ui-monospace,Consolas,monospace;font-size:13px}
.m code.i{background:#04010f;padding:1px 5px;border-radius:4px}
.m .act{margin-top:6px;display:flex;gap:6px}
.m .act button{padding:2px 8px;font-size:12px;opacity:.7}
.cursor::after{content:"▍";color:var(--cyan);animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:0}}
.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}
.empty .big{font-size:56px}
.err{align-self:center;color:var(--red);background:#2a0b18;border:1px solid var(--red);border-radius:10px;padding:8px 12px;max-width:90%}
#form{display:flex;gap:8px;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--panel)}
#inp{flex:1;resize:none;max-height:180px;min-height:44px}
#overlay{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:10;padding:12px}
#overlay.on{display:flex}
#modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(640px,100%);max-height:92vh;overflow:auto;padding:16px}
#modal h2{margin:0 0 8px;font-size:18px;color:var(--cyan)}
.row{display:flex;gap:8px}.row>*{flex:1}
.row.fix>.em{flex:none;width:76px}
.plist{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.plist button.on{border-color:var(--cyan);color:var(--cyan)}
.hint{color:var(--muted);font-size:12px;margin-top:4px}
pre.prev{background:#04010f;border:1px solid var(--line);border-radius:8px;padding:10px;white-space:pre-wrap;font-size:12px;color:var(--muted);max-height:140px;overflow:auto}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
#pend{display:none;gap:8px;padding:8px 14px 0;background:var(--panel);flex-wrap:wrap}
#pend.on{display:flex}
#pend .th{position:relative}
#pend img,.m img.ph{max-width:120px;max-height:90px;border-radius:8px;border:1px solid var(--line);display:block}
.m img.ph{max-width:240px;max-height:180px;margin:6px 0}
#pend .th button{position:absolute;top:-6px;right:-6px;padding:0 6px;border-radius:50%;font-size:12px}
#cVideo{position:absolute;right:14px;top:14px;width:150px;height:112px;object-fit:cover;border-radius:12px;border:2px solid var(--green);background:#000;display:none}
#cVideo.on{display:block}
#call{position:fixed;inset:0;background:radial-gradient(circle at 50% 30%,#1b0b4a,#070314 70%);z-index:20;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;text-align:center}
#call.on{display:flex}
#call .big{font-size:96px;width:170px;height:170px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:2px solid var(--line);transition:box-shadow .2s,border-color .2s}
#call.listen .big{border-color:var(--green);box-shadow:0 0 0 8px #3cff9a22,0 0 40px #3cff9a55}
#call.think .big{border-color:var(--yellow);box-shadow:0 0 0 8px #fcee0a22,0 0 40px #fcee0a44}
#call.speak .big{border-color:var(--cyan);box-shadow:0 0 0 8px #00f0ff22,0 0 40px #00f0ff66;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#call .cn{font-size:24px;font-weight:700}
#call .cs{color:var(--muted);min-height:22px}
#call .ct{font-family:ui-monospace,Consolas,monospace;color:var(--cyan)}
#call .cx{max-width:560px;color:var(--text);opacity:.85;min-height:44px;font-size:15px}
#call .cb{display:flex;gap:14px;margin-top:10px}
#call .cb button{width:68px;height:68px;border-radius:50%;font-size:26px;padding:0}
#call .hang{background:var(--red);border-color:var(--red)}
#call .on2{border-color:var(--yellow);color:var(--yellow)}
@media(max-width:760px){
 #side{position:fixed;inset:0 auto 0 0;z-index:5;transform:translateX(-100%);transition:transform .2s;width:82%}
 #side.open{transform:none}
 #menu{display:inline-block}
 #bar select{max-width:120px}
}
</style>
</head>
<body>
<aside id="side">
  <h1>AI PLUS</h1>
  <div class="sub">личная нейросеть на вашем сервере</div>
  <div class="top"><button class="primary" id="newChat" style="width:100%">＋ Новый чат</button></div>
  <div id="chats"></div>
  <div class="top"><button id="personas" style="width:100%">🎭 Персонажи и характер</button></div>
  <div class="top" id="appOnly" style="display:none"><button id="srv" style="width:100%">🔌 Адрес сервера</button></div>
</aside>
<section id="main">
  <div id="bar">
    <button id="menu">☰</button>
    <div class="who"><span class="av" id="av">🤖</span><span class="nm" id="nm">—</span></div>
    <select id="model" title="Модель"></select>
    <button id="spk" title="Озвучивать ответы">🔇</button>
    <button id="callBtn" title="Позвонить (голосом)">📞</button>
    <button id="edit" title="Настроить персонажа">⚙</button>
  </div>
  <div id="msgs"></div>
  <div id="pend"></div>
  <input type="file" id="fileGal" accept="image/*" hidden>
  <input type="file" id="fileCam" accept="image/*" capture="environment" hidden>
  <form id="form">
    <button type="button" id="attach" title="Прикрепить фото">📎</button>
    <button type="button" id="shotBtn" title="Снять фото">📷</button>
    <textarea id="inp" rows="1" placeholder="Напишите сообщение… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
    <button class="primary" id="send" type="submit">Отправить</button>
  </form>
</section>

<div id="call">
  <video id="cVideo" playsinline muted autoplay></video>
  <div class="big" id="cAv">🤖</div>
  <div class="cn" id="cName">—</div>
  <div class="cs" id="cStat">Соединяю…</div>
  <div class="ct" id="cTime">00:00</div>
  <div class="cx" id="cText"></div>
  <div class="cb">
    <button id="cMute" title="Выключить микрофон">🎤</button>
    <button id="cCam" title="Включить камеру (нейросеть будет видеть кадры)">📹</button>
    <button id="cFlip" title="Другая камера" style="display:none">🔄</button>
    <button id="cSkip" title="Перебить / ответить сейчас">⏭</button>
    <button class="hang" id="cHang" title="Положить трубку">📵</button>
  </div>
  <div class="hint" id="cHint"></div>
</div>

<div id="overlay"><div id="modal">
  <h2>Персонаж</h2>
  <div class="plist" id="plist"></div>
  <div class="row fix"><div class="em"><label>Значок</label><input id="pEmoji" maxlength="4"></div><div><label>Имя персонажа</label><input id="pName" maxlength="40"></div></div>
  <label>Характер (кто он, как себя ведёт)</label>
  <textarea id="pChar" rows="4" placeholder="Например: саркастичный, но добрый друг, любит шутки про кофе"></textarea>
  <div class="row"><div><label>Как обращаться к вам</label><input id="pUser" maxlength="40" placeholder="имя или прозвище"></div>
  <div><label>Язык ответов</label><select id="pLang"><option value="русском">русский</option><option value="английском">английский</option><option value="немецком">немецкий</option><option value="">как напишете вы</option></select></div></div>
  <div class="row"><div><label>Длина ответов</label><select id="pLen"><option value="">обычная</option><option value="short">короткие</option><option value="long">подробные</option></select></div>
  <div><label>Фантазия: <span id="tv">0.7</span></label><input id="pTemp" type="range" min="0" max="1.5" step="0.1"></div></div>
  <div class="row"><div><label>Голос</label><select id="pVoice"><option value="">по умолчанию</option></select></div>
  <div><label>Скорость речи: <span id="rv">1</span></label><input id="pRate" type="range" min="0.6" max="1.6" step="0.05"></div>
  <div><label>Тон: <span id="pv">1</span></label><input id="pPitch" type="range" min="0.5" max="1.5" step="0.05"></div></div>
  <div class="btns" style="margin-top:6px"><button type="button" id="pTest">🔊 Проверить голос</button></div>
  <label>Свои правила (необязательно)</label>
  <textarea id="pRules" rows="3" placeholder="Например: никогда не извиняйся; в конце каждого ответа добавляй шутку"></textarea>
  <label>Итоговый «системный промпт» (его получает нейросеть)</label>
  <pre class="prev" id="pPrev"></pre>
  <label><input type="checkbox" id="pRaw" style="width:auto"> Написать системный промпт самому (вместо сборки из полей выше)</label>
  <textarea id="pRawText" rows="5" style="display:none"></textarea>
  <div class="btns">
    <button class="primary" id="pSave">Сохранить и выбрать</button>
    <button id="pNew">＋ Новый персонаж</button>
    <button id="pDup">Копия</button>
    <button class="danger" id="pDel">Удалить</button>
    <button id="pClose">Закрыть</button>
  </div>
  <div class="hint">Персонажи сохраняются в этом браузере/приложении. Смена персонажа действует на новые сообщения в текущем чате.</div>
</div></div>

<script>
(function(){
'use strict';
var KEY='aiPlus.v1';
var PRESETS=[
 {id:'p-helper',emoji:'🤖',name:'Помощник',character:'Умный, вежливый и точный помощник. Объясняет просто и по делу.',user:'',lang:'русском',len:'',temp:0.5,rules:'',raw:false,rawText:''},
 {id:'p-friend',emoji:'😎',name:'Друг',character:'Живой, остроумный друг: шутит, поддерживает, говорит неформально, но не грубит.',user:'',lang:'русском',len:'short',temp:0.9,rules:'',raw:false,rawText:''},
 {id:'p-teacher',emoji:'🧑‍🏫',name:'Учитель',character:'Терпеливый учитель. Объясняет шаг за шагом, приводит примеры и в конце задаёт один проверочный вопрос.',user:'',lang:'русском',len:'long',temp:0.4,rules:'',raw:false,rawText:''},
 {id:'p-coder',emoji:'👨‍💻',name:'Программист',character:'Опытный программист. Пишет рабочий код с короткими пояснениями, указывает на возможные ошибки.',user:'',lang:'русском',len:'',temp:0.3,rules:'Код всегда в блоках с указанием языка.',raw:false,rawText:''}
];
var S=load();
S.personas.forEach(normP);if(S.speak===undefined)S.speak=false;
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&s.personas&&s.chats)return s}catch(e){}
 return {personas:JSON.parse(JSON.stringify(PRESETS)),chats:[],persona:'p-helper',chat:null,model:''}}
function normP(p){if(p.voice===undefined)p.voice='';if(!p.rate)p.rate=1;if(!p.pitch)p.pitch=1;return p}
function trimImages(){
 var all=[];S.chats.forEach(function(c){c.messages.forEach(function(m){if(m.images&&m.images.length)all.push(m)})});
 all.slice(0,Math.max(0,all.length-6)).forEach(function(m){m.hadImage=m.images.length;delete m.images});
}
function save(){trimImages();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(id){return document.getElementById(id)}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function persona(id){return S.personas.find(function(p){return p.id===(id||S.persona)})||S.personas[0]}
function chat(){return S.chats.find(function(c){return c.id===S.chat})}

function systemPrompt(p){
 var base=systemPrompt0(p);
 return call.on?base+' Сейчас идёт голосовой звонок: говори естественно, как по телефону, коротко (1–3 предложения), без списков, разметки, эмодзи и кода.'+(cam.stream?' Собеседник включил камеру: к его репликам прикладывается кадр с неё; если уместно, коротко скажи, что видишь.':''):base;
}
function systemPrompt0(p){
 if(p.raw&&p.rawText.trim())return p.rawText.trim();
 var t='Тебя зовут '+(p.name||'Ассистент')+'. ';
 if(p.character.trim())t+=p.character.trim()+' ';
 if(p.user.trim())t+='Собеседника зовут '+p.user.trim()+'. ';
 if(p.lang)t+='Отвечай на '+p.lang+' языке. ';else t+='Отвечай на том языке, на котором написал собеседник. ';
 if(p.len==='short')t+='Отвечай коротко. ';if(p.len==='long')t+='Отвечай подробно. ';
 if(p.rules.trim())t+='Дополнительные правила: '+p.rules.trim();
 return t.trim();
}


// ---------- голос: озвучка и распознавание (в приложении — родные средства телефона, в браузере — встроенные) ----------
var Voice=(function(){
 var nat=!!(window.AiPlus&&window.AiPlus.speak);
 var synth=window.speechSynthesis||null;
 var SR=window.SpeechRecognition||window.webkitSpeechRecognition||null;
 var speakWait={},listenWait=null,seq=0,rec=null;
 window.AiPlusEvt=function(type,a){
  if(type==='speakDone'){var f=speakWait[a];if(f){delete speakWait[a];f()}}
  else if(listenWait){var w=listenWait;
   if(type==='result'){listenWait=null;w.ok(a||'')}
   else if(type==='error'){listenWait=null;w.no(a||'error')}
  }
 };
 var V={
  native:nat,
  canSpeak:nat||!!synth,
  canListen:function(){try{return nat?!!(window.AiPlus.canListen&&window.AiPlus.canListen()):(!!SR&&window.isSecureContext)}catch(e){return false}},
  voices:function(){
   try{
    if(nat&&window.AiPlus.voices){return JSON.parse(window.AiPlus.voices()||'[]')}
    if(synth){return synth.getVoices().map(function(v){return{name:v.name,lang:v.lang}})}
   }catch(e){}
   return [];
  },
  speak:function(text,o){
   o=o||{};
   return new Promise(function(res){
    text=String(text||'').trim();if(!text){res();return}
    if(nat){var id=++seq;speakWait[id]=res;window.AiPlus.speak(text.slice(0,3500),o.rate||1,o.pitch||1,o.voice||'',id);return}
    if(!synth){res();return}
    var u=new SpeechSynthesisUtterance(text.slice(0,3500));
    u.rate=o.rate||1;u.pitch=o.pitch||1;u.lang='ru-RU';
    if(o.voice){var vv=synth.getVoices().find(function(x){return x.name===o.voice});if(vv){u.voice=vv;u.lang=vv.lang}}
    else{var ru=synth.getVoices().find(function(x){return /^ru/i.test(x.lang)});if(ru)u.voice=ru}
    u.onend=u.onerror=function(){res()};
    synth.speak(u);
   });
  },
  stopSpeak:function(){
   try{if(nat)window.AiPlus.stopSpeak();else if(synth)synth.cancel()}catch(e){}
   var w=speakWait;speakWait={};Object.keys(w).forEach(function(k){w[k]()});
  },
  listen:function(lang){
   lang=lang||'ru-RU';
   return new Promise(function(ok,no){
    if(nat){listenWait={ok:ok,no:no};window.AiPlus.listen(lang);return}
    if(!SR){no('unsupported');return}
    var r=new SR();rec=r;r.lang=lang;r.interimResults=false;r.continuous=false;r.maxAlternatives=1;
    var got='',done=false;
    r.onresult=function(e){for(var i=e.resultIndex;i<e.results.length;i++)if(e.results[i].isFinal)got+=e.results[i][0].transcript};
    r.onerror=function(e){if(done)return;done=true;rec=null;no(e.error||'error')};
    r.onend=function(){if(done)return;done=true;rec=null;ok(got)};
    try{r.start()}catch(e){done=true;no('error')}
   });
  },
  stopListen:function(){
   try{if(nat){window.AiPlus.stopListen();if(listenWait){var w=listenWait;listenWait=null;w.no('aborted')}}else if(rec){rec.abort()}}catch(e){}
  }
 };
 if(synth&&synth.onvoiceschanged!==undefined)synth.onvoiceschanged=function(){if(window.fillVoices)window.fillVoices()};
 return V;
})();

// ---------- отрисовка ----------
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e}
function renderText(box,text){
 box.textContent='';
 var parts=text.split(/```/);
 parts.forEach(function(part,i){
  if(i%2===1){
   var nl=part.indexOf('\n');var body=nl>=0?part.slice(nl+1):part;
   var pre=el('pre');var code=el('code',null,body.replace(/\n$/,''));pre.appendChild(code);box.appendChild(pre);
  }else{
   var segs=part.split(/(`[^`\n]+`)/);
   segs.forEach(function(sg){
    if(sg.length>2&&sg[0]==='`'&&sg[sg.length-1]==='`')box.appendChild(el('code','i',sg.slice(1,-1)));
    else box.appendChild(document.createTextNode(sg));
   });
  }
 });
}
function renderBar(){var p=persona();$('av').textContent=p.emoji||'🤖';$('nm').textContent=p.name||'Ассистент'}
function renderChats(){
 var box=$('chats');box.textContent='';
 S.chats.slice().sort(function(a,b){return b.at-a.at}).forEach(function(c){
  var d=el('div','chat'+(c.id===S.chat?' on':''));
  d.appendChild(el('span','t',c.title||'Новый чат'));
  var x=el('button','x','✕');x.title='Удалить чат';
  x.onclick=function(e){e.stopPropagation();if(confirm('Удалить этот чат?')){S.chats=S.chats.filter(function(k){return k.id!==c.id});if(S.chat===c.id)S.chat=null;save();renderAll()}};
  d.appendChild(x);
  d.onclick=function(){S.chat=c.id;if(c.persona&&S.personas.some(function(p){return p.id===c.persona}))S.persona=c.persona;save();renderAll();$('side').classList.remove('open')};
  box.appendChild(d);
 });
}
var streaming=null;
function renderMsgs(){
 var box=$('msgs');box.textContent='';
 var c=chat();
 if(!c||!c.messages.length){
  var e=el('div','empty');e.appendChild(el('div','big',persona().emoji||'🤖'));
  e.appendChild(el('h3',null,'Привет! Я '+(persona().name||'Ассистент')));
  e.appendChild(el('p',null,'Напишите сообщение внизу. Характер, имя и стиль можно настроить кнопкой ⚙ вверху.'));
  box.appendChild(e);return;
 }
 var pn=persona(c.persona);
 c.messages.forEach(function(m,i){
  var d=el('div','m '+m.role);
  d.appendChild(el('div','who',m.role==='user'?(persona().user||'Вы'):((pn.emoji||'')+' '+(pn.name||'Ассистент'))));
  var body=el('div');renderText(body,m.content);d.appendChild(body);
  if(m.images)m.images.filter(isImg).forEach(function(u){var im=el('img','ph');im.src=u;d.appendChild(im)});
  if(m.hadImage)d.appendChild(el('div','who','🖼 фото удалено из памяти, чтобы не занимать место'));
  if(streaming&&streaming.index===i)d.classList.add('cursor');
  if(m.role==='assistant'&&!(streaming&&streaming.index===i)){
   var a=el('div','act');
   var cp=el('button',null,'Копировать');cp.onclick=function(){navigator.clipboard&&navigator.clipboard.writeText(m.content)};a.appendChild(cp);
   if(i===c.messages.length-1){var rg=el('button',null,'Ещё раз');rg.onclick=regenerate;a.appendChild(rg)}
   d.appendChild(a);
  }
  box.appendChild(d);
 });
 box.scrollTop=box.scrollHeight;
}
function renderAll(){renderBar();renderChats();renderMsgs();$('model').value=S.model||$('model').value}

// ---------- связь с сервером ----------
function showErr(t){var box=$('msgs');var d=el('div','err',t);box.appendChild(d);box.scrollTop=box.scrollHeight}
function loadModels(){
 fetch('api/tags').then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json()}).then(function(j){
  var sel=$('model');sel.textContent='';
  (j.models||[]).forEach(function(m){var o=el('option',null,m.name);o.value=m.name;sel.appendChild(o)});
  if(!sel.options.length){sel.appendChild(el('option',null,'нет моделей'))}
  else{if(!S.model||!Array.prototype.some.call(sel.options,function(o){return o.value===S.model}))S.model=sel.options[0].value;sel.value=S.model}
 }).catch(function(){showErr('Нет связи с нейросетью. Включён ли VPN (Gateway Plus) и работает ли сервер?')});
}
$('model').onchange=function(){S.model=this.value;save()};

var ctrl=null;
function send(text){
 if(streaming)return;
 var c=chat();
 if(!c){c={id:uid('c'),title:'',at:Date.now(),persona:S.persona,messages:[]};S.chats.push(c);S.chat=c.id}
 c.persona=S.persona;
 var um={role:'user',content:text};if(pending.length){um.images=pending.slice();pending=[];renderPend()}
 c.messages.push(um);
 if(!c.title)c.title=text.slice(0,40);
 c.at=Date.now();
 run(c);
}
function regenerate(){
 var c=chat();if(!c||streaming)return;
 while(c.messages.length&&c.messages[c.messages.length-1].role==='assistant')c.messages.pop();
 if(c.messages.length)run(c);
}
function run(c,hook){
 var p=persona(c.persona);
 var lastImg=-1;c.messages.forEach(function(m,i){if(m.images&&m.images.length)lastImg=i});
 var needVision=lastImg>=0&&lastImg===c.messages.length-1;
 var model=S.model;
 if(needVision){model=visionModel();if(!model){showErr('Нет модели, которая умеет смотреть картинки. Запустите скрипт установки на сервере заново или выполните там: ollama pull gemma3:4b');return Promise.resolve('')}}
 var msgs=[{role:'system',content:systemPrompt(p)}].concat(c.messages.map(function(m,i){var o={role:m.role,content:m.content};if(i===lastImg&&m.images&&m.images.length)o.images=m.images.filter(isImg).map(function(u){return u.split(',')[1]});return o}));
 var reply={role:'assistant',content:''};c.messages.push(reply);
 streaming={index:c.messages.length-1};
 ctrl=new AbortController();
 $('send').textContent='Стоп';$('send').classList.remove('primary');
 save();renderAll();
 var body=JSON.stringify({model:model,messages:msgs,stream:true,options:{temperature:p.temp}});
 return fetch('api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:body,signal:ctrl.signal}).then(function(r){
  if(!r.ok)throw new Error('HTTP '+r.status);
  var rd=r.body.getReader(),dec=new TextDecoder(),buf='';
  function pump(){return rd.read().then(function(x){
   if(x.done)return;
   buf+=dec.decode(x.value,{stream:true});
   var lines=buf.split('\n');buf=lines.pop();
   lines.forEach(function(ln){ln=ln.trim();if(!ln)return;try{var o=JSON.parse(ln);if(o.error)throw new Error(o.error);if(o.message&&o.message.content){reply.content+=o.message.content;if(hook)hook(o.message.content)}}catch(e){if(e.message&&e.message!=='Unexpected end of JSON input')throw e}});
   var box=$('msgs').lastElementChild;if(box&&box.classList.contains('assistant')){var b=box.children[1];if(b)renderText(b,reply.content)}
   $('msgs').scrollTop=$('msgs').scrollHeight;
   return pump();
  })}
  return pump();
 }).catch(function(e){
  if(e.name!=='AbortError')showErr('Не получилось: '+(e.message||e)+'. Проверьте VPN и сервер.');
 }).then(function(){
  if(!reply.content)c.messages.pop();
  streaming=null;ctrl=null;$('send').textContent='Отправить';$('send').classList.add('primary');
  c.at=Date.now();save();renderAll();
  if(!call.on&&S.speak&&reply.content)speakReply(reply.content,persona(c.persona));
  return reply.content;
 });
}
$('form').onsubmit=function(e){
 e.preventDefault();
 if(call.on){$('inp').value='';autosize();return}
 if(streaming){ctrl&&ctrl.abort();return}
 var t=$('inp').value.trim();if(!t&&!pending.length)return;if(!t)t='Что на этом фото?';$('inp').value='';autosize();send(t);
};
$('inp').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}});
function autosize(){var t=$('inp');t.style.height='auto';t.style.height=Math.min(180,t.scrollHeight)+'px'}
$('inp').addEventListener('input',autosize);
$('newChat').onclick=function(){S.chat=null;save();renderAll();$('side').classList.remove('open');$('inp').focus()};
$('menu').onclick=function(){$('side').classList.toggle('open')};



// ---------- фото и камера ----------
var pending=[];
function isImg(u){return typeof u==='string'&&/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/.test(u)}
function visionModel(){
 var names=Array.prototype.map.call($('model').options,function(o){return o.value});
 return names.find(function(n){return /moondream|llava|vision|gemma3|minicpm|qwen.*vl|granite.*vision/i.test(n)})||null;
}
function toJpeg(src,w,h,max){
 var k=Math.min(1,max/Math.max(w,h)),cv=document.createElement('canvas');
 cv.width=Math.max(1,Math.round(w*k));cv.height=Math.max(1,Math.round(h*k));
 cv.getContext('2d').drawImage(src,0,0,cv.width,cv.height);
 return cv.toDataURL('image/jpeg',0.78);
}
function fileToJpeg(f){return new Promise(function(res,rej){
 var u=URL.createObjectURL(f),im=new Image();
 im.onload=function(){var d=toJpeg(im,im.naturalWidth,im.naturalHeight,1024);URL.revokeObjectURL(u);res(d)};
 im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('не картинка'))};im.src=u;
})}
function renderPend(){
 var b=$('pend');b.textContent='';b.classList.toggle('on',pending.length>0);
 pending.forEach(function(u,i){var d=el('div','th'),im=el('img');im.src=u;d.appendChild(im);
  var x=el('button',null,'✕');x.type='button';x.onclick=function(){pending.splice(i,1);renderPend()};d.appendChild(x);b.appendChild(d)});
}
function addFiles(files){Array.prototype.slice.call(files||[]).slice(0,4).forEach(function(f){
 fileToJpeg(f).then(function(u){if(pending.length<4){pending.push(u);renderPend()}}).catch(function(){showErr('Не получилось прочитать картинку.')})})}
$('attach').onclick=function(){$('fileGal').click()};
$('shotBtn').onclick=function(){$('fileCam').click()};
$('fileGal').onchange=function(){addFiles(this.files);this.value=''};
$('fileCam').onchange=function(){addFiles(this.files);this.value=''};
document.addEventListener('paste',function(e){var fs=[];Array.prototype.forEach.call((e.clipboardData&&e.clipboardData.items)||[],function(it){if(it.kind==='file'&&/^image\//.test(it.type))fs.push(it.getAsFile())});if(fs.length)addFiles(fs)});

// живое видео в звонке: камера включена — к каждой вашей реплике прикладывается свежий кадр
var cam={stream:null,facing:'user'};
async function startCam(){
 if(!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)){$('cHint').textContent='Камера недоступна: в браузере нужен защищённый адрес https://…:8443 (один раз подтвердите сертификат) или приложение AI Plus.';return}
 try{
  var st=await navigator.mediaDevices.getUserMedia({video:{facingMode:cam.facing,width:{ideal:640},height:{ideal:480}},audio:false});
  cam.stream=st;var v=$('cVideo');v.srcObject=st;v.classList.add('on');$('cCam').classList.add('on2');$('cFlip').style.display='';
  $('cHint').textContent='Камера включена: к вашим фразам прикладывается кадр. Нейросеть должна уметь смотреть картинки.';
 }catch(e){$('cHint').textContent='Нет доступа к камере: '+(e&&e.name||e)}
}
function stopCam(){
 if(cam.stream){cam.stream.getTracks().forEach(function(t){t.stop()});cam.stream=null}
 var v=$('cVideo');v.classList.remove('on');v.srcObject=null;$('cCam').classList.remove('on2');$('cFlip').style.display='none';
}
function camFrame(){var v=$('cVideo');if(!cam.stream||!v.videoWidth)return null;return toJpeg(v,v.videoWidth,v.videoHeight,640)}
$('cCam').onclick=function(){cam.stream?stopCam():startCam()};
$('cFlip').onclick=function(){cam.facing=cam.facing==='user'?'environment':'user';stopCam();startCam()};

// ---------- озвучка ответов и звонок ----------
function plain(t){return t.replace(/```[\s\S]*?```/g,' (код пропускаю) ').replace(/[*_`#>]/g,'').replace(/\s+/g,' ').trim()}
function speakReply(text,p){Voice.stopSpeak();Voice.speak(plain(text),{voice:p.voice,rate:p.rate,pitch:p.pitch})}
function syncSpk(){$('spk').textContent=S.speak?'🔊':'🔇';$('spk').title=S.speak?'Озвучка ответов включена':'Озвучка ответов выключена'}
$('spk').onclick=function(){S.speak=!S.speak;if(!S.speak)Voice.stopSpeak();save();syncSpk()};
if(!Voice.canSpeak){$('spk').style.display='none';$('callBtn').style.display='none'}
syncSpk();

var call={on:false,mute:false,t0:0,tick:null,skip:false};
function cset(state,text){$('call').className='on '+state;$('cStat').textContent=text}
function ctime(){var s=Math.floor((Date.now()-call.t0)/1000);$('cTime').textContent=('0'+Math.floor(s/60)).slice(-2)+':'+('0'+s%60).slice(-2)}
function delay(ms){return new Promise(function(r){setTimeout(r,ms)})}
$('callBtn').onclick=function(){
 if(call.on)return;
 var p=persona();
 call.on=true;call.mute=false;call.skip=false;call.t0=Date.now();
 $('cAv').textContent=p.emoji||'🤖';$('cName').textContent=p.name||'Ассистент';$('cText').textContent='';$('cMute').classList.remove('on2');
 var hint='';
 if(!Voice.canListen())hint=window.isSecureContext===false&&!Voice.native?'Микрофон в браузере работает только по защищённому адресу: откройте чат по https://…:8443 (один раз подтвердите сертификат) или используйте приложение AI Plus на телефоне. Пока можно печатать — я буду отвечать голосом.':'Распознавание речи здесь недоступно — печатайте, а я отвечу голосом.';
 $('cHint').textContent=hint;
 cset('think','Соединяю…');
 call.tick=setInterval(ctime,1000);ctime();
 callLoop();
};
function endCall(){
 stopCam();
 call.on=false;clearInterval(call.tick);Voice.stopListen();Voice.stopSpeak();if(ctrl)ctrl.abort();
 $('call').className='';
}
$('cHang').onclick=endCall;
$('cMute').onclick=function(){call.mute=!call.mute;this.classList.toggle('on2',call.mute);this.textContent=call.mute?'🙊':'🎤';if(call.mute)Voice.stopListen()};
$('cSkip').onclick=function(){call.skip=true;Voice.stopSpeak();Voice.stopListen()};
async function callLoop(){
 var p=persona();
 // приветствие: нейросеть начинает разговор первой
 await callTurn(null);
 while(call.on){
  if(call.mute||!Voice.canListen()){
   cset('listen',call.mute?'Микрофон выключен':'Печатайте — отвечу голосом');
   await delay(400);
   if(!Voice.canListen()&&call.on){ /* текстовый ввод во время звонка: ждём сообщение из поля */ var t=await waitTyped();if(t&&call.on)await callTurn(t)}
   continue;
  }
  cset('listen','Слушаю…');
  var text='';
  try{text=await Voice.listen('ru-RU')}catch(e){
   if(!call.on)break;
   if(e==='not-allowed'||e==='service-not-allowed'||e==='permission'){$('cHint').textContent='Нет доступа к микрофону. Разрешите его в настройках и позвоните снова.';call.mute=true;$('cMute').classList.add('on2');continue}
   await delay(e==='no-speech'||e==='aborted'||e==='nomatch'?200:1500);continue;
  }
  if(!call.on)break;
  text=(text||'').trim();
  if(call.skip){call.skip=false;continue}
  if(!text)continue;
  await callTurn(text);
 }
}
var typedWaiter=null;
function waitTyped(){return new Promise(function(r){typedWaiter=r;var f=function(){if(!call.on){clearInterval(i);r('')}};var i=setInterval(f,500)})}
// одна «реплика» звонка: отправили → читаем ответ по предложениям и сразу озвучиваем
async function callTurn(text){
 var p=persona();
 var c=chat();
 if(!c){c={id:uid('c'),title:'Звонок',at:Date.now(),persona:S.persona,messages:[]};S.chats.push(c);S.chat=c.id}
 c.persona=S.persona;
 if(text===null){ if(c.messages.length)return; c.messages.push({role:'user',content:'(звонок начался — поздоровайся коротко и спроси, о чём поговорим)'}) }
 else{var um={role:'user',content:text};var fr=camFrame();if(fr)um.images=[fr];c.messages.push(um);if(!c.title||c.title==='Звонок')c.title=text.slice(0,40)}
 $('cText').textContent=text?('Вы: '+text):'';
 cset('think','Думаю…');
 var buf='',queue=[],speaking=false,finished=false;
 async function pump(){
  if(speaking)return;speaking=true;
  while(queue.length&&call.on&&!call.skip){
   var s=queue.shift();cset('speak','Говорит…');$('cText').textContent=s;
   await Voice.speak(plain(s),{voice:p.voice,rate:p.rate,pitch:p.pitch});
  }
  speaking=false;
 }
 var inCode=false;
 function feed(delta){
  delta.split('```').forEach(function(part,i){if(i>0)inCode=!inCode;if(!inCode)buf+=part});
  var m;
  while((m=buf.match(/^([\s\S]*?[.!?…]+["»)]*(\s+|$)|[\s\S]*?\n)/))&&m[0].trim().length>3&&(m[0].length<buf.length||/\s$/.test(m[0]))){
   queue.push(m[0].trim());buf=buf.slice(m[0].length);pump();
  }
 }
 await run(c,feed);
 if(buf.trim()&&call.on){queue.push(buf.trim());buf='';pump()}
 while((speaking||queue.length)&&call.on&&!call.skip)await delay(120);
 call.skip=false;
}
// текст, набранный во время звонка без микрофона
$('form').addEventListener('submit',function(){if(call.on&&typedWaiter){var t=$('inp').value.trim();if(t){var w=typedWaiter;typedWaiter=null;setTimeout(function(){w(t)},0)}}},true);

window.fillVoices=function(){
 var sel=$('pVoice');if(!sel)return;var cur=editing?editing.voice:'';
 sel.textContent='';var d=el('option',null,'по умолчанию');d.value='';sel.appendChild(d);
 var vs=Voice.voices().slice().sort(function(a,b){return (/^ru/i.test(b.lang)?1:0)-(/^ru/i.test(a.lang)?1:0)});
 vs.forEach(function(v){var o=el('option',null,v.name+' ('+v.lang+')');o.value=v.name;sel.appendChild(o)});
 sel.value=cur||'';
};

// ---------- редактор персонажей ----------
var editing=null;
function openEditor(id){editing=JSON.parse(JSON.stringify(persona(id)));fillEditor();$('overlay').classList.add('on')}
function fillEditor(){
 var pl=$('plist');pl.textContent='';
 S.personas.forEach(function(p){var b=el('button',p.id===editing.id?'on':'',(p.emoji||'')+' '+p.name);b.type='button';b.onclick=function(){editing=JSON.parse(JSON.stringify(p));fillEditor()};pl.appendChild(b)});
 $('pEmoji').value=editing.emoji||'';$('pName').value=editing.name||'';$('pChar').value=editing.character||'';
 $('pUser').value=editing.user||'';$('pLang').value=editing.lang;$('pLen').value=editing.len||'';
 $('pTemp').value=editing.temp;$('tv').textContent=editing.temp;$('pRules').value=editing.rules||'';
 $('pRate').value=editing.rate;$('rv').textContent=editing.rate;$('pPitch').value=editing.pitch;$('pv').textContent=editing.pitch;if(window.fillVoices)window.fillVoices();$('pVoice').value=editing.voice||'';
 $('pRaw').checked=!!editing.raw;$('pRawText').value=editing.rawText||'';$('pRawText').style.display=editing.raw?'block':'none';
 preview();
}
function readEditor(){
 editing.emoji=$('pEmoji').value.trim();editing.name=$('pName').value.trim()||'Ассистент';editing.character=$('pChar').value;
 editing.user=$('pUser').value;editing.lang=$('pLang').value;editing.len=$('pLen').value;editing.temp=parseFloat($('pTemp').value)||0.7;
 editing.voice=$('pVoice').value;editing.rate=parseFloat($('pRate').value)||1;editing.pitch=parseFloat($('pPitch').value)||1;
 editing.rules=$('pRules').value;editing.raw=$('pRaw').checked;editing.rawText=$('pRawText').value;
}
function preview(){readEditor();$('pPrev').textContent=systemPrompt0(editing);$('tv').textContent=editing.temp;$('rv').textContent=editing.rate;$('pv').textContent=editing.pitch;$('rv').textContent=editing.rate;$('pv').textContent=editing.pitch;$('pRawText').style.display=editing.raw?'block':'none'}
['pEmoji','pName','pChar','pUser','pLang','pLen','pTemp','pRules','pRaw','pRawText','pVoice','pRate','pPitch'].forEach(function(id){$(id).addEventListener('input',preview);$(id).addEventListener('change',preview)});
$('pSave').onclick=function(){readEditor();var i=S.personas.findIndex(function(p){return p.id===editing.id});if(i>=0)S.personas[i]=editing;else S.personas.push(editing);S.persona=editing.id;save();$('overlay').classList.remove('on');renderAll()};
$('pNew').onclick=function(){editing={id:uid('p-'),emoji:'✨',name:'Новый персонаж',character:'',user:'',lang:'русском',len:'',temp:0.7,rules:'',raw:false,rawText:'',voice:'',rate:1,pitch:1};fillEditor()};
$('pDup').onclick=function(){readEditor();editing=JSON.parse(JSON.stringify(editing));editing.id=uid('p-');editing.name+=' (копия)';fillEditor()};
$('pDel').onclick=function(){
 if(S.personas.length<2){alert('Должен остаться хотя бы один персонаж.');return}
 if(!confirm('Удалить персонажа «'+editing.name+'»?'))return;
 S.personas=S.personas.filter(function(p){return p.id!==editing.id});if(S.persona===editing.id)S.persona=S.personas[0].id;save();editing=JSON.parse(JSON.stringify(S.personas[0]));fillEditor();renderAll();
};
$('pTest').onclick=function(){readEditor();Voice.stopSpeak();Voice.speak('Привет! Меня зовут '+(editing.name||'Ассистент')+'. Вот так я звучу.',{voice:editing.voice,rate:editing.rate,pitch:editing.pitch})};
$('pClose').onclick=function(){$('overlay').classList.remove('on')};
$('overlay').onclick=function(e){if(e.target===this)$('overlay').classList.remove('on')};
$('edit').onclick=function(){openEditor()};
$('personas').onclick=function(){openEditor();$('side').classList.remove('open')};

if(window.AiPlus){$('appOnly').style.display='block';$('srv').onclick=function(){window.AiPlus.changeServer()}}
renderAll();loadModels();
})();
